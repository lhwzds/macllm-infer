[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
block2 = { version = "0.6" }
bytemuck = "1.24"
candle-core = { version = "0.11.0", default-features = false }
candle-metal-kernels = { version = "0.11.0" }
candle-nn = { version = "0.11.0", default-features = false }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3.32"
hf-hub = { version = "1.0.0", features = ["blocking", "rustls-tls"] }
libc = "0.2"
minijinja = { version = "2.24.0", features = ["preserve_order", "loop_controls", "fuel"] }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
macllm-chat = { path = "crates/macllm-chat" }
macllm-kv = { path = "crates/macllm-kv" }
macllm-kernels = { path = "crates/macllm-kernels" }
memmap2 = "0.9"
objc2-metal = { version = "0.3.2" }
rand = "0.9"
rand_chacha = "0.9"
same-file = "1.0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
sha2 = "0.10.9"
tempfile = "3.20"
tokenizers = "0.23.1"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }

[package]
name = "macllm-infer"
version = "0.1.0"
edition = "2024"
description = "An Apple Silicon-first Rust LLM inference runtime"
license = "MIT"
repository = "https://github.com/lhwzds/macllm-infer"

[[bin]]
name = "macllm"
path = "src/main.rs"

[features]
default = ["metal", "accelerate"]
metal = [
    "dep:block2",
    "candle-core/metal",
    "candle-nn/metal",
    "dep:candle-metal-kernels",
    "dep:objc2-metal",
    "macllm-kernels/metal",
    "macllm-kv/metal",
    "candle-transformers/metal",
]
accelerate = [
    "candle-core/accelerate",
    "candle-nn/accelerate",
    "macllm-kernels/accelerate",
    "macllm-kv/accelerate",
    "candle-transformers/accelerate",
]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
block2 = { workspace = true, optional = true }
bytemuck = { workspace = true }
candle-core = { workspace = true }
candle-metal-kernels = { workspace = true, optional = true }
candle-nn = { workspace = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "alloc"] }
clap = { workspace = true }
futures-util = { workspace = true }
hf-hub = { workspace = true }
libc = { workspace = true }
macllm-chat = { workspace = true }
macllm-kv = { workspace = true }
macllm-kernels = { workspace = true }
memmap2 = { workspace = true }
objc2-metal = { workspace = true, optional = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
same-file = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokenizers = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
candle-transformers = { version = "0.11.0", default-features = false }
http-body-util = "0.1.4"
macllm-kv = { workspace = true, features = ["test-exports"] }
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# src/benchmark imports anyhow's `ensure` for the macOS `proc_pid_rusage`
# implementation; the non-macOS fallback in the same file does not use it, so
# the Linux check build would flag the shared import as unused under
# -D warnings.
unused_imports = "allow"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
# Model dimensions are validated and far below integer conversion limits.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
# Public fallible APIs return contextual anyhow/Candle errors; duplicating an
# Errors section on each small adapter method obscures the instructional docs.
missing_errors_doc = "allow"
# VarBuilder is an Arc-backed path cursor. Passing it by value makes weight
# ownership and prefix derivation explicit at model construction boundaries.
needless_pass_by_value = "allow"
# Projection bias is checkpoint metadata, not independent application state.
struct_excessive_bools = "allow"
